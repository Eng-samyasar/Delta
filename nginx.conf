# Nginx Server Block Configuration for Delta General Supplies

server {
    listen 80;
    listen [::]:80;
    server_name deltasupplies-eg.com www.deltasupplies-eg.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name deltasupplies-eg.com www.deltasupplies-eg.com;

    root /var/www/delta-website;
    index index.html;

    # شهادات SSL
    # ssl_certificate /etc/letsencrypt/live/deltasupplies-eg.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/deltasupplies-eg.com/privkey.pem;

    # رؤوس الأمان (Security Headers)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; frame-src https://www.google.com https://maps.google.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # معالجة الروابط وصفحة 404
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # التخزين المؤقت للأصول والملفات الثابتة
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    # حظر الوصول إلى الملفات الحساسة
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
